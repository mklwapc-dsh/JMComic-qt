# JMComic-qt —— Linux arm64 (aarch64) 原生构建，含超分 (Waifu2x/Real-CUGAN/Real-ESRGAN)
#
# 与 build_arm64.yml（无超分版）的区别：
#   1) 先在 runner 上从源码编译 sr-vulkan 的 aarch64 轮子（作者仓库已预留 arm64 路径，
#      只需 3 行补丁让 setup.py 在 aarch64 上选择 libvulkan.aarch64.so）；
#   2) 安装该轮子 + 三个模型包，用完整的 src/requirements.txt 构建；
#   3) 冒烟测试直接验证【CPU 超分】全链路（runner 无 GPU，sr.init() 返回负值走 CPU 模式），
#      另用 lavapipe（软件 Vulkan）附带验证 GPU 路径；
#   4) PyInstaller 需 --collect-all 收集 sr_vulkan 与三个模型包（模型 .param/.bin 是数据文件，
#      只靠 hook 的 hiddenimport 不够，必须连带数据一起收集）。
#
# 注意：首次构建需现场编译 ncnn（约 25-45 分钟），成功后会缓存轮子，后续构建约 10-15 分钟。

name: build-arm64-sr

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  linux-aarch64-sr:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 240
    env:
      PACKAGENAME: jmcomic_linux_aarch64_sr
      SR_VERSION: 2.0.1.1
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖（Qt 运行库 + 编译工具链 + Vulkan loader）
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake g++ \
            libegl1 libgl1 libglx-mesa0 libdrm2 libgbm1 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libx11-6 libx11-xcb1 libice6 libsm6 libxext6 libxi6 libxrender1 libxtst6 \
            libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libdouble-conversion3 libbrotli1 libzstd1 libffi8 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libwayland-server0 \
            libtiff5 \
            libgtk-3-0 libgdk-pixbuf-2.0-0 libpango-1.0-0 \
            libmariadb3 libpq5 libodbc2 \
            libssl3 libicu70 libfuse2 \
            libvulkan1 mesa-vulkan-drivers vulkan-tools

      - name: 安装 libwebp.so.6（jammy 只有 libwebp7，SONAME 不匹配，从 focal 取 libwebp6）
        run: |
          wget -q -O /tmp/libwebp6.deb \
            http://ports.ubuntu.com/pool/main/libw/libwebp/libwebp6_0.6.1-2ubuntu0.20.04.3_arm64.deb
          dpkg-deb -x /tmp/libwebp6.deb /tmp/libwebp6
          sudo cp -a /tmp/libwebp6/usr/lib/aarch64-linux-gnu/libwebp*.so* /usr/lib/aarch64-linux-gnu/
          sudo ldconfig
          ldconfig -p | grep libwebp

      - name: 恢复 sr-vulkan 编译产物缓存（轻量：只缓存包目录 + 已编译的 .so）
        id: sr-cache
        uses: actions/cache@v4
        with:
          path: sr-pkg-src
          key: sr-vulkan-pkgsrc-${{ env.SR_VERSION }}-aarch64-v1

      - name: 编译 sr-vulkan aarch64 扩展（缓存未命中时）
        if: steps.sr-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/tonquer/sr-vulkan.git sr-vulkan-src
          cd sr-vulkan-src
          # 补丁：aarch64 上链接作者预置的 libvulkan.aarch64.so（x86_64 构建用 libvulkan.so）
          python3 - <<'PY'
          s = open('setup.py').read()
          old = 'os.path.abspath("VulkanSDK/linux/libvulkan.so")'
          assert old in s, 'patch target not found in setup.py'
          new = ('os.path.abspath("VulkanSDK/linux/libvulkan.aarch64.so" '
                 'if platform.machine().lower().startswith("aarch") '
                 'else "VulkanSDK/linux/libvulkan.so")')
          open('setup.py', 'w').write(s.replace(old, new))
          print('setup.py patched for aarch64')
          PY
          # 4 核并行编译 ncnn + 四个超分工具
          export CMAKE_BUILD_PARALLEL_LEVEL=4
          python3 setup.py build
          # 关键步骤：setup.py build 把 sr_vulkan.so 编译到 build/lib.<平台>/sr_vulkan/ 下，
          # 而 setup2.py 打包只收集源码目录 sr_vulkan/ 里的文件（MANIFEST.in 的
          # recursive-include sr_vulkan *.so）——必须把 .so 复制回源码包目录，否则
          # 打出来的轮子里没有扩展模块（会变成 py3-none 的空壳轮子）
          SO_FILE=$(find build -name 'sr_vulkan.so' -not -path '*/temp.*' | head -n1)
          echo "编译产物: ${SO_FILE}"
          test -n "${SO_FILE}" || { echo "::error::未找到 sr_vulkan.so"; exit 1; }
          cp "${SO_FILE}" sr_vulkan/
          ls -la sr_vulkan/
          cd ..
          # 组装轻量打包源（只留打 wheel 需要的文件，供缓存与后续打包使用）
          mkdir -p sr-pkg-src
          cp -r sr-vulkan-src/sr_vulkan sr-pkg-src/
          cp sr-vulkan-src/setup2.py sr-vulkan-src/MANIFEST.in sr-vulkan-src/LICENSE sr-pkg-src/

      - name: 打包 sr-vulkan aarch64 轮子
        run: |
          cd sr-pkg-src
          test -f sr_vulkan/sr_vulkan.so || { echo "::error::sr_vulkan.so 缺失（缓存或编译有问题）"; exit 1; }
          pip install wheel
          # 优先 abi3 标签（与官方 x86_64 轮子一致），失败则退化为 cp310
          python3 setup2.py bdist_wheel --plat-name=manylinux_2_31_aarch64 --py-limited-api=cp37 \
            || python3 setup2.py bdist_wheel --plat-name=manylinux_2_31_aarch64
          ls -la dist/
          # 自检：轮子里必须包含 sr_vulkan.so
          python3 - <<'PY'
          import zipfile, glob
          whl = glob.glob('dist/*.whl')
          assert whl, 'no wheel built'
          names = zipfile.ZipFile(whl[0]).namelist()
          assert any(n.endswith('sr_vulkan/sr_vulkan.so') for n in names), 'wheel 缺少 sr_vulkan.so: ' + str(names)
          print('✅ 轮子内容自检通过:', whl[0], len(names), '个文件')
          PY
          mkdir -p ../sr-wheel-dist
          cp dist/*.whl ../sr-wheel-dist/

      - name: 安装 Python 依赖（含超分）
        run: |
          python -m pip install --upgrade pip
          pip install ./sr-wheel-dist/*.whl
          pip install sr-vulkan-model-waifu2x sr-vulkan-model-realcugan sr-vulkan-model-realesrgan
          pip install pyinstaller
          # 用本地轮子替代 PyPI 上的 sr-vulkan（PyPI 只有 x86_64 轮子）
          grep -v '^sr-vulkan$' src/requirements.txt > /tmp/requirements_sr_arm64.txt
          pip install -r /tmp/requirements_sr_arm64.txt
          QT_QPA_PLATFORM=offscreen python -c "from PySide6 import QtCore, QtGui, QtWidgets; import curl_cffi; print('base deps ok')"

      - name: CPU 超分冒烟测试（runner 无 GPU，验证 CPU 模式全链路）
        run: |
          python3 - <<'PY'
          from sr_vulkan import sr_vulkan as sr
          import io
          from PIL import Image

          print("version:", sr.getVersion())
          sr.setDebug(True)
          sts = sr.init()
          print("sr.init ->", sts, "（<0 表示无 GPU，走 CPU 模式，符合预期）")
          print("cpu cores:", sr.getCpuCoreNum())
          print("gpu list:", sr.getGpuInfo())

          # 与应用一致：initSet(config.Encode, config.UseCpuNum) = initSet(0, 0)
          sts2 = sr.initSet(0, 0)
          print("initSet(0,0) ->", sts2)

          buf = io.BytesIO()
          Image.new("RGB", (64, 64), (128, 90, 60)).save(buf, "PNG")
          data = buf.getvalue()

          rid = sr.add(data, sr.MODEL_WAIFU2X_CUNET_UP2X, 1, 2.0, format="png")
          if rid < 0:
              print("add failed:", sr.getLastError(), "→ 用 gpuId=-1 显式 CPU 重试")
              sr.initSet(-1, 4)
              rid = sr.add(data, sr.MODEL_WAIFU2X_CUNET_UP2X, 1, 2.0, format="png")
          print("sr.add ->", rid)
          assert rid >= 0, "sr.add 失败: " + sr.getLastError()

          out = sr.load(0)
          assert out, "sr.load 返回空"
          out_data, fmt, back_id, tick = out
          print("sr.load ->", len(out_data), "bytes, format:", fmt, ", tick:", tick)
          assert isinstance(out_data, bytes) and len(out_data) > 100
          img = Image.open(io.BytesIO(out_data))
          print("输出尺寸:", img.size, "（输入 64x64，2x 应为 128x128）")
          assert img.size == (128, 128), "输出尺寸不是 2x"
          print("✅ CPU 超分全链路通过")
          PY

      - name: GPU 超分冒烟测试（lavapipe 软件 Vulkan，仅供参考）
        continue-on-error: true
        run: |
          ls /usr/share/vulkan/icd.d/
          export VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.aarch64.json
          python3 - <<'PY'
          from sr_vulkan import sr_vulkan as sr
          import io
          from PIL import Image
          sts = sr.init()
          print("init:", sts, "gpu:", sr.getGpuInfo())
          buf = io.BytesIO()
          Image.new("RGB", (64, 64), (128, 90, 60)).save(buf, "PNG")
          rid = sr.add(buf.getvalue(), sr.MODEL_WAIFU2X_CUNET_UP2X, 1, 2.0, format="png")
          print("add:", rid)
          out = sr.load(0)
          if out:
              print("✅ lavapipe GPU 路径输出", len(out[0]), "bytes")
          PY

      - name: PyInstaller 打包 + 动态库完整性检查
        run: |
          python script/build_qrc.py
          cd src
          pyinstaller --hidden-import=_cffi_backend --collect-data curl_cffi \
            --collect-all shiboken6 \
            --collect-all sr_vulkan \
            --collect-all sr_vulkan_model_waifu2x \
            --collect-all sr_vulkan_model_realcugan \
            --collect-all sr_vulkan_model_realesrgan \
            -w start.py
          cd dist
          find start/_internal -name 'libshiboken6*' | grep -q . \
            || { echo "::error::libshiboken6 未被收集进包"; exit 1; }
          # 确认超分库和模型都进了包
          find start/_internal -name 'sr_vulkan*.so' | grep -q . \
            || { echo "::error::sr_vulkan 扩展未被收集"; exit 1; }
          find start/_internal -name '*.param' | grep -q . \
            || { echo "::error::超分模型(.param)未被收集进包"; exit 1; }
          echo "已收集模型文件数: $(find start/_internal -name '*.param' | wc -l)"
          export LD_LIBRARY_PATH="$(pwd)/start/_internal:${LD_LIBRARY_PATH}"
          CHECK() { { ldd start/start; find start/_internal -name '*.so*' -exec ldd {} + ; } 2>/dev/null; }
          CHECK > /tmp/ldd.log
          if grep -q "not found" /tmp/ldd.log; then
            echo "::error::存在缺失的系统动态库："
            grep "not found" /tmp/ldd.log
            exit 1
          fi
          echo "所有动态库依赖齐全"

      - name: 制作目录版 tar.gz（无需 FUSE，解压即用）
        run: |
          cd src/dist
          cp -r start jmcomic
          chmod +x jmcomic/start
          tar -czf ${{ env.PACKAGENAME }}.tar.gz jmcomic
          mv ${{ env.PACKAGENAME }}.tar.gz ../../

      - name: 制作 AppImage（arm64）
        run: |
          cd src/dist
          mkdir -p jmcomic.AppRun/usr/bin
          cp -r ../../res/appimage/* jmcomic.AppRun/
          cp -r ../../res/icon/logo_round.png jmcomic.AppRun/JMComic.png
          cp -r start/* jmcomic.AppRun/usr/bin/
          chmod +x jmcomic.AppRun/AppRun jmcomic.AppRun/usr/bin/start
          wget -q -O appimagetool-aarch64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool-aarch64.AppImage
          ./appimagetool-aarch64.AppImage jmcomic.AppRun \
            || { ./appimagetool-aarch64.AppImage --appimage-extract-and-run jmcomic.AppRun; }
          APPIMAGE=$(find . -maxdepth 1 \( -name 'JMComic*.AppImage' -o -name 'jmcomic*.AppImage' \) | head -n1)
          echo "生成的 AppImage: ${APPIMAGE}"
          mv "${APPIMAGE}" ../../${{ env.PACKAGENAME }}.AppImage

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGENAME }}
          path: |
            ${{ env.PACKAGENAME }}.AppImage
            ${{ env.PACKAGENAME }}.tar.gz
            sr-wheel-dist/*.whl
          retention-days: 30

      - name: 附加到 Release（仅推送 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGENAME }}.AppImage
            ${{ env.PACKAGENAME }}.tar.gz
            sr-wheel-dist/*.whl
