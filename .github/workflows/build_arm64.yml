# JMComic-qt —— Linux arm64 (aarch64) 原生构建，无超分 (nosr) 版
#
# 说明：
#   - 使用 GitHub 官方 arm64 托管 runner（ubuntu-22.04-arm），公共仓库免费（2025-08-07 起 GA）。
#   - 选择 22.04 是为了让产物兼容性更广：构建机 glibc 2.35，
#     产物可在 Ubuntu 22.04+ / Debian 12+ / 树莓派 OS Bookworm+ 上运行。
#   - 超分（waifu2x / sr-vulkan）没有 linux-aarch64 轮子，本工作流按官方 nosr 路线构建，
#     程序运行时会自动检测并禁用超分功能（见 src/start.py）。
#   - 与 x64 打包脚本的关键区别：
#       1) 不能加 --add-data "../lib/linux/*:."（那是 x86-64 的 libcurl-impersonate .so，
#          curl_cffi 的 aarch64 wheel 自带同名库）；
#       2) AppRun 里写死 EXEC=start，二进制必须保持名为 start，不要重命名为 JMComic。
#
# 触发条件：
#   1) 推送到 main/master —— 第一次上传代码即自动开始构建；
#   2) 推送 v* 标签 —— 构建并自动把产物附加到该 tag 的 Release；
#   3) 手动触发 —— Actions 页面 → build-arm64 → Run workflow。

name: build-arm64

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  linux-aarch64-nosr:
    runs-on: ubuntu-22.04-arm
    env:
      PACKAGENAME: jmcomic_linux_aarch64_nosr
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装系统依赖（Qt/OpenGL/X11 运行库 + FUSE）
        # 包清单依据：对 PySide6 6.5.3 aarch64 轮子做 ELF (DT_NEEDED) 依赖扫描，
        # Qt 官方轮子把下列库链接到系统而非自带，缺一个 PySide6 就无法导入
        #（如 libdouble-conversion.so.3 / libbrotlidec.so.1 / libICE.so.6 等）。
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libglx-mesa0 libdrm2 libgbm1 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb1 libxcb-cursor0 libxcb-glx0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-render0 libxcb-shape0 \
            libxcb-shm0 libxcb-sync1 libxcb-util1 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libx11-6 libx11-xcb1 libice6 libsm6 libxext6 libxi6 libxrender1 libxtst6 \
            libglib2.0-0 libfontconfig1 libfreetype6 libdbus-1-3 \
            libdouble-conversion3 libbrotli1 libzstd1 libffi8 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libwayland-server0 \
            libwebp6 libwebpdemux2 libwebpmux3 libtiff5 \
            libgtk-3-0 libgdk-pixbuf-2.0-0 libpango-1.0-0 \
            libmariadb3 libpq5 libodbc2 \
            libssl3 libicu70 libfuse2

      - name: 安装 Python 依赖（无超分版）并验证 aarch64 轮子可加载
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r src/requirements_nosr.txt
          # 冒烟测试：确认 PySide6 / curl_cffi 的 aarch64 原生库能正常加载
          QT_QPA_PLATFORM=offscreen python -c "from PySide6 import QtCore, QtGui, QtWidgets; import curl_cffi; print('arm64 deps ok')"

      - name: PyInstaller 打包 + 动态库完整性检查
        run: |
          python script/build_qrc.py
          cd src
          pyinstaller --hidden-import=_cffi_backend --collect-data curl_cffi -w start.py
          cd dist
          # 检查主程序和所有内置 .so 的系统动态库依赖是否齐全
          CHECK() { { ldd start/start; find start/_internal -name '*.so*' -exec ldd {} + ; } 2>/dev/null; }
          CHECK > /tmp/ldd.log
          if grep -q "not found" /tmp/ldd.log; then
            echo "::error::存在缺失的系统动态库："
            grep "not found" /tmp/ldd.log
            exit 1
          fi
          echo "所有动态库依赖齐全"

      - name: 制作目录版 tar.gz（无需 FUSE，解压即用）
        run: |
          cd src/dist
          cp -r start jmcomic
          chmod +x jmcomic/start
          tar -czf ${{ env.PACKAGENAME }}.tar.gz jmcomic
          mv ${{ env.PACKAGENAME }}.tar.gz ../../

      - name: 制作 AppImage（arm64）
        run: |
          cd src/dist
          mkdir -p jmcomic.AppRun/usr/bin
          cp -r ../../res/appimage/* jmcomic.AppRun/
          cp -r ../../res/icon/logo_round.png jmcomic.AppRun/JMComic.png
          cp -r start/* jmcomic.AppRun/usr/bin/
          # 重要：AppRun 写死 EXEC=start，二进制保持 start 名称
          chmod +x jmcomic.AppRun/AppRun jmcomic.AppRun/usr/bin/start
          wget -q -O appimagetool-aarch64.AppImage \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage
          chmod +x appimagetool-aarch64.AppImage
          # 优先直接运行（需 FUSE，上一步已安装）；失败则解包运行（无需 FUSE）
          ./appimagetool-aarch64.AppImage jmcomic.AppRun \
            || { ./appimagetool-aarch64.AppImage --appimage-extract-and-run jmcomic.AppRun; }
          ls -la
          APPIMAGE=$(find . -maxdepth 1 \( -name 'JMComic*.AppImage' -o -name 'jmcomic*.AppImage' \) | head -n1)
          echo "生成的 AppImage: ${APPIMAGE}"
          mv "${APPIMAGE}" ../../${{ env.PACKAGENAME }}.AppImage

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGENAME }}
          path: |
            ${{ env.PACKAGENAME }}.AppImage
            ${{ env.PACKAGENAME }}.tar.gz
          retention-days: 30

      - name: 附加到 Release（仅推送 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGENAME }}.AppImage
            ${{ env.PACKAGENAME }}.tar.gz
